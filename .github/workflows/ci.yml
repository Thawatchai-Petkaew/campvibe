name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not ci): vitest4/rolldown ships wasm32-wasi optional bindings
      # whose nested @emnapi deps are pruned from the lockfile on macOS, so `npm ci`
      # fails the cross-platform lock-sync check on linux. install honors the lock.
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Palette guard (no hardcoded colours)
        run: npm run check:palette
      - name: DS consistency guard (no tabler / !h- / arbitrary px radius)
        run: npm run check:ds
      - name: Type check
        run: npm run typecheck
      - name: Test + coverage
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  # CAM-230 B4 — Advisory visual-regression + axe a11y gate.
  # Runs Playwright against the production build in a Linux Chromium environment.
  # `continue-on-error: true` = pixel diffs / a11y findings produce a reviewable
  # artifact and a warning annotation, but NEVER block a merge.
  # Results (report + diff images) are uploaded as a CI artifact for review.
  # Cross-OS note: baselines committed from macOS will differ from this Linux runner;
  # see e2e/README.md for how to update Linux-native baselines.
  visual-a11y:
    runs-on: ubuntu-latest
    # Run independently of quality-gate; do not block if quality-gate fails.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Use the same install strategy as quality-gate (honors lock, avoids wasm32 issue).
      - run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium
      - name: Build (production)
        run: npm run build
        env:
          # Suppress DB-connect errors during build (same as vercel-build pattern).
          # Prisma generate runs inside `npm run build`; no migration needed here.
          SKIP_ENV_VALIDATION: "1"
      - name: Run Playwright (visual + a11y)
        # CAM-359: scoped to the chromium project only. playwright.config.ts now
        # also defines regression/regression-setup projects (a separate, local-DB-
        # only suite) — this job has no Postgres service and must stay unaffected.
        run: npx playwright test --project=chromium
        env:
          # Point at the production build started by the webServer config.
          # SKIP_BUILD=1 tells playwright.config.ts to only `npm run start`
          # (the build was already done above).
          SKIP_BUILD: "1"
          CI: "true"
          # CAM-261: `next start` runs with NODE_ENV=production, and NextAuth
          # v5's host-trust check rejects the CI runner's plain localhost:3000
          # (no AUTH_URL / reverse proxy) with an UntrustedHost error, which
          # spams the server log on every /api/auth/* call. AUTH_TRUST_HOST is
          # NextAuth's documented escape hatch for exactly this case (a non-DB,
          # non-Vercel host) — no schema/logic change. A real DATABASE_URL is
          # NOT set here: this job has no Postgres service, so `/` still 500s
          # on any DB-backed query. That's a separate, out-of-scope gap (would
          # need a CI Postgres service) — left for backend/devops follow-up.
          AUTH_TRUST_HOST: "true"
      - name: Upload Playwright report + diff images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # CAM-359 — Advisory E2E regression suite (harness + first 6 specs).
  # Drives REAL host create/update/delete flows (via the real /login form +
  # storageState — see playwright.config.ts + e2e/regression/) against a
  # Postgres service container that lives ONLY inside this job/runner — never
  # a shared staging/prod DB. That isolation comes from the hardcoded local
  # DATABASE_URL below (the "Migrate + seed" step runs BEFORE Playwright, so
  # the harness's own BR-1 guard — e2e/regression/db-guard.ts, which only
  # runs inside the `regression-setup` Playwright project — does NOT cover
  # that step). The guard's real job is to catch a LOCAL dev misconfiguring
  # `DATABASE_URL` when running this same suite by hand (its actual
  # non-negotiable purpose per BR-1), and it still runs here too, immediately
  # before any login/spec, as a second check on the Playwright-driven steps.
  # `continue-on-error: true` + not a required check: advisory-first rollout
  # per .claude/rules/ops.md §Gate policy v2 — flips to blocking only after
  # BR-6's stability criterion (>=10 consecutive green runs) is met, a
  # separate future decision.
  e2e-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campvibe
          POSTGRES_PASSWORD: campvibe
          POSTGRES_DB: campvibe_e2e
        ports:
          - 5432:5432
        # EC-5: GitHub Actions waits for the service health check to pass
        # before running any job step, so migrate/seed never race a
        # not-yet-ready Postgres.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://campvibe:campvibe@localhost:5432/campvibe_e2e?schema=public"
      AUTH_SECRET: "e2e-regression-ci-secret-not-a-real-secret-0000000000"
      NEXTAUTH_URL: "http://localhost:3100"
      # NextAuth v5 rejects the CI runner's plain localhost host without this
      # (same reasoning as the visual-a11y job above).
      AUTH_TRUST_HOST: "true"
      PW_REGRESSION: "1"
      E2E_PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium
      - name: Migrate + seed the CI Postgres service (BR-3 idempotent seed)
        run: npx prisma migrate deploy && npx tsx prisma/seed.ts
      - name: Run Playwright (regression)
        run: npx playwright test --project=regression
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-regression-report
          path: playwright-report/
          retention-days: 14

  # Post-deploy smoke against the env's live URL. Opt-in: set repo variables
  # STAGING_URL / PROD_URL (Settings → Secrets and variables → Actions → Variables).
  # If the matching var is unset it skips (so main pushes never fail before staging exists).
  smoke:
    needs: quality-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Smoke (curl deployed URL if configured)
        run: |
          URL=""
          [ "${{ github.ref_name }}" = "main" ] && URL="${{ vars.PROD_URL }}"
          [ "${{ github.ref_name }}" = "staging" ] && URL="${{ vars.STAGING_URL }}"
          if [ -z "$URL" ]; then
            echo "::notice::No URL variable for '${{ github.ref_name }}' — skipping smoke."
            exit 0
          fi
          echo "Smoking $URL (waits for Vercel deploy) ..."
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && echo "✓ smoke ok" && exit 0
            sleep 15
          done
          echo "::error::Smoke failed for $URL (no HTTP 200 within ~3min)"
          exit 1
